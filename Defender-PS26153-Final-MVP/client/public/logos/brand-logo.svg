<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8A8A93" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#52525A" stop-opacity="0.4" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon -->
  <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" stroke="url(#cyberGlow)" stroke-width="2" fill="none" filter="url(#neonBlur)" />
  
  <!-- Mid Shield Geometry -->
  <polygon points="50,16 79,32 79,68 50,84 21,68 21,32" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="rgba(12,12,14,0.6)" />
  
  <!-- Core Node Network -->
  <circle cx="50" cy="50" r="10" fill="url(#innerGlow)" />
  <circle cx="50" cy="50" r="18" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  
  <!-- Circuit Nodes -->
  <line x1="50" y1="20" x2="50" y2="40" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="50" y1="60" x2="50" y2="80" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="26" y1="38" x2="42" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="74" y1="38" x2="58" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="26" y1="62" x2="42" y2="54" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="74" y1="62" x2="58" y2="54" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <circle cx="50" cy="20" r="2.5" fill="#FFFFFF" />
  <circle cx="50" cy="80" r="2.5" fill="#FFFFFF" />
  <circle cx="26" cy="38" r="2.5" fill="#FFFFFF" />
  <circle cx="74" cy="38" r="2.5" fill="#FFFFFF" />
  <circle cx="26" cy="62" r="2.5" fill="#FFFFFF" />
  <circle cx="74" cy="62" r="2.5" fill="#FFFFFF" />
</svg>
